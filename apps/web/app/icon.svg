<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>

  <!-- Outer ring arc (top-left 3/4) -->
  <path d="M16 4 A12 12 0 1 1 4 16" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Play triangle (centred, slightly right) -->
  <polygon points="13,10 13,22 23,16" fill="url(#g1)" opacity="0.95"/>

  <!-- Spark dot top-right -->
  <circle cx="25" cy="7" r="2" fill="url(#g2)"/>
</svg>
