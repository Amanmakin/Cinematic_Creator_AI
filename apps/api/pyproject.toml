[project]
name = "api"
version = "0.1.0"
description = "FastAPI surface layer wrapping the LangGraph orchestration engine."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.1.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "orchestrator",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "httpx>=0.27.0",
    "pygltflib>=1.16.5",
    "numpy>=2.4.5",
    "arq>=0.26.0",
    "redis[asyncio]>=5.0.0",
    "openai>=1.30.0",
    "numpy>=2.4.5",
    "tiktoken>=0.7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../", "../orchestrator/src"]
asyncio_mode = "auto"

[tool.uv.sources]
orchestrator = { path = "../orchestrator", editable = true }
